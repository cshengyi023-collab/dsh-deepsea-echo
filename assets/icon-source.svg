<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <clipPath id="card"><rect x="6" y="6" width="500" height="500" rx="104"/></clipPath>
    <radialGradient id="bg" cx="50%" cy="36%" r="82%">
      <stop offset="0" stop-color="#103362"/>
      <stop offset="0.45" stop-color="#071c3a"/>
      <stop offset="1" stop-color="#02070f"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d6bfe" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8be8ff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4d6bfe" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b7f2ff" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#4d6bfe" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9fefff" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="whale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5ebff"/>
    </linearGradient>
    <pattern id="hex" width="56" height="48.5" patternUnits="userSpaceOnUse">
      <path d="M14 0 H42 L56 24 L42 48 H14 L0 24 Z" fill="none" stroke="#7fd4ff" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#bfe9ff" fill-opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>
  <g clip-path="url(#card)">
    <rect x="6" y="6" width="500" height="500" fill="url(#bg)"/>
    <rect x="6" y="6" width="500" height="500" fill="url(#hex)" opacity="0.85"/>
    <path d="M-60 350 L 170 -30 L 300 -30 L 90 400 Z" fill="url(#beam)" opacity="0.55"/>
    <rect x="6" y="6" width="500" height="500" fill="url(#scan)"/>
    <!-- sonar rings -->
    <g fill="none" stroke="#8be8ff">
      <circle cx="256" cy="232" r="206" stroke-opacity="0.10" stroke-width="1"/>
      <circle cx="256" cy="232" r="214" stroke-opacity="0.32" stroke-width="2" stroke-dasharray="2 26"/>
      <circle cx="256" cy="232" r="168" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="4 16"/>
      <path d="M256 38 A194 194 0 0 1 450 232" stroke-opacity="0.55" stroke-width="2.5"/>
      <path d="M62 232 A194 194 0 0 1 256 38" stroke-opacity="0.30" stroke-width="2"/>
      <path d="M256 426 A194 194 0 0 1 62 232" stroke-opacity="0.18" stroke-width="1.5"/>
      <path d="M450 232 A194 194 0 0 1 400 360" stroke-opacity="0.22" stroke-width="1.5"/>
    </g>
    <ellipse cx="256" cy="238" rx="150" ry="120" fill="#4d6bfe" opacity="0.16" filter="url(#halo)"/>
    <!-- hexagon frame -->
    <g filter="url(#glow)">
      <path d="M256 84 L 388 160 V 316 L 256 392 L 124 316 V 160 Z" fill="#04152c" fill-opacity="0.62" stroke="url(#rim)" stroke-width="2.5"/>
      <path d="M256 104 L 369 170 V 306 L 256 372 L 143 306 V 170 Z" fill="none" stroke="#8be8ff" stroke-opacity="0.20" stroke-width="1"/>
    </g>
    <!-- whale glyph -->
    <g transform="translate(256 236) scale(3.35) translate(-32 -33)" filter="url(#glow)">
      <path d="M52 33c0-6.6-7.5-12-16.8-12-8.4 0-14.9 3.7-17.7 8.4L6.8 18.9c-1 6.5 1.9 12.1 6.5 14.9l-5.6 5.6c7.5 1.9 13.1-0.9 15-4.7 4.7 5.6 12.1 8.4 19.6 6.5 5.6-1.9 9.3-4.7 9.3-8.4Z" fill="url(#whale)"/>
      <circle cx="43.4" cy="30.4" r="2.1" fill="#04101f"/>
      <path d="M18.5 50.6 H45.5" stroke="#a9ecff" stroke-opacity="0.8" stroke-width="1.3" fill="none"/>
    </g>
    <!-- wordmark -->
    <text x="256" y="432" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', monospace" font-size="24" letter-spacing="6.5" fill="#e4f7ff">DEEP-SEA ECHO</text>
    <text x="256" y="466" text-anchor="middle" font-family="'Microsoft YaHei UI','PingFang SC',sans-serif" font-size="17" letter-spacing="10" fill="#8be8ff" opacity="0.8">深 海 回 响</text>
    <!-- corner brackets -->
    <g stroke="#8be8ff" stroke-opacity="0.55" stroke-width="2" fill="none">
      <path d="M42 92 V 60 H 74"/><path d="M470 92 V 60 H 438"/>
      <path d="M42 424 V 456 H 74"/><path d="M470 424 V 456 H 438"/>
    </g>
    <text x="78" y="58" font-family="Consolas, monospace" font-size="14" letter-spacing="4" fill="#8be8ff" opacity="0.75">DSH·07</text>
    <circle cx="440" cy="54" r="4" fill="#f3b54a" opacity="0.9"/>
    <rect x="6" y="6" width="500" height="500" rx="104" fill="none" stroke="url(#rim)" stroke-width="2.5" opacity="0.9"/>
  </g>
</svg>

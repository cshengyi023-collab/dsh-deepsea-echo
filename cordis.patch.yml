# dsh-deepsea-echo —— bundle patch that inserts the startup animation into the profile.
#
# The host half is empty on purpose: this plugin is pure browser UI. The browser
# half is discovered through package.json's `dsh.client` declaration and served
# as /plugins/dsh-deepsea-echo/client.js by the client module system.
- insert:
    - id: deepsea-echo
      name: dsh-deepsea-echo
